<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D2A7A">
<meta name="robots" content="noindex">
<title>Help profile — Jirani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="page">
  <div class="topbar"><a class="icon-btn" id="back" aria-label="Back to shortlist"></a></div>
  <div id="body"><div class="empty"><span class="spinner" style="margin:0 auto"></span></div></div>
</main>
<script type="module">
  import { api, getConfig, esc, label, money, initials, avatarClass, icons, param, CHECK_LABELS, $ } from '/app.js';
  const id = param('id'), rid = param('r');
  const back = rid ? `/shortlist.html?r=${encodeURIComponent(rid)}` : '/';
  $('#back').innerHTML = icons.back;
  $('#back').href = back;

  try {
    const [{ help: h }, cfg] = await Promise.all([
      api(`/api/helps/${encodeURIComponent(id || '')}${rid ? `?r=${encodeURIComponent(rid)}` : ''}`),
      getConfig()
    ]);
    document.title = `${h.name} — Jirani`;
    const checks = Object.entries(CHECK_LABELS).map(([k, text]) =>
      `<li class="${h.checks[k] ? '' : 'no'}">${h.checks[k] ? icons.tick : icons.dash}${esc(text)}${h.checks[k] ? '' : ' <span class="small">(not yet)</span>'}</li>`).join('');
    const pill = h.badge === 'Certified' ? 'pill strong' : h.badge === 'Checked' ? 'pill' : 'pill grey';
    const salaryNote = h.salary
      ? `${esc(h.name.split(' ')[0])} asks ${money(h.salary)} a month.`
      : 'Salary to agree at the interview.';

    $('#body').innerHTML = `
      <div class="center" style="display:flex; flex-direction:column; align-items:center">
        <span class="avatar big ${avatarClass(h.id)}">${esc(initials(h.name))}</span>
        <h1 style="margin:12px 0 0; font-size:24px; letter-spacing:-0.02em">${esc(h.name)}</h1>
        <p class="small" style="margin:4px 0 0">${h.kinds.map(label).join(' · ')}${h.tasks.length ? ' · ' + h.tasks.map(label).join(', ').toLowerCase() : ''}</p>
        <div class="row" style="gap:6px; margin-top:10px"><span class="${pill}">${esc(h.badge)}</span><span class="pill gold">${h.years} yrs experience</span></div>
      </div>

      <div class="card section">
        <p class="kicker">What we checked</p>
        <ul class="checklist">${checks}</ul>
      </div>

      ${h.about ? `<div class="card section"><p class="kicker">About</p><p style="margin:0">${esc(h.about)}</p></div>` : ''}

      <div class="card section">
        <dl class="kv" style="font-size:14px">
          <dt>Lives in</dt><dd>${esc(h.area)}${h.commuteMin ? ` · about ${h.commuteMin} min from you` : ''}</dd>
          ${h.languages ? `<dt>Speaks</dt><dd>${esc(h.languages)}</dd>` : ''}
          ${h.phone ? `<dt>Phone</dt><dd><a href="tel:+${esc(h.phoneIntl)}">${esc(h.phone)}</a></dd>` : ''}
        </dl>
      </div>

      <div class="banner cream section"><div><strong>${salaryNote}</strong><span style="font-size:13px">The legal minimum for domestic workers in Nairobi is ${money(cfg.minWage)} a month.</span></div></div>

      <div class="sticky-cta">
        ${h.phone
          ? `<a class="btn" href="tel:+${esc(h.phoneIntl)}">${icons.phone} Call ${esc(h.name.split(' ')[0])}</a>`
          : rid ? `<a class="btn" href="/pay.html?r=${encodeURIComponent(rid)}">Book interview · ${money(cfg.matchFee)}</a>`
                : `<a class="btn" href="/request.html">Find helps near you</a>`}
      </div>`;
  } catch (e) {
    $('#body').innerHTML = `<div class="empty">${esc(e.message)}<p><a href="${back}">Go back</a></p></div>`;
  }
</script>
</body>
</html>
