<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B34A6">
<title>Find a helper — MtaaCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<script>
  // Opened by double-clicking the file? These pages need the local server.
  if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML = '<main style="font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 20px;line-height:1.5;color:#24173A">' +
      '<h1 style="font-size:24px">Start the MtaaCare server first</h1>' +
      '<p>You opened this page as a file. It needs the app running. In a terminal, inside the <b>mtaacare-app</b> folder, run:</p>' +
      '<pre style="background:#F7EFF3;padding:12px 14px;border-radius:10px;font-size:15px">npm start</pre>' +
      '<p>Then open <b>http://localhost:8788</b> in your browser.</p></main>';
  });
</script>
<main class="page find">
  <div class="topbar">
    <a class="icon-btn" href="/" aria-label="Back" id="back"></a>
    <div>
      <h1>Find a helper</h1>
      <div class="small">Takes about 30 seconds</div>
    </div>
  </div>

  <form id="form" class="stack" novalidate>
    <fieldset class="step-card">
      <legend><span class="step-num">1</span>Type of help</legend>
      <div class="segmented">
        <label class="chip"><input type="radio" name="kind" value="live-in" checked><span>Live-in</span></label>
        <label class="chip"><input type="radio" name="kind" value="live-out"><span>Live-out</span></label>
        <label class="chip"><input type="radio" name="kind" value="day"><span>Day help</span></label>
      </div>
    </fieldset>

    <fieldset class="step-card">
      <legend><span class="step-num">2</span>Help with</legend>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="tasks" value="cleaning" checked><span>Cleaning</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="cooking" checked><span>Cooking</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="laundry"><span>Laundry</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="children"><span>Children</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="baby"><span>Baby</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="elderly"><span>Elderly care</span></label>
      </div>
    </fieldset>

    <fieldset class="step-card">
      <legend><span class="step-num">3</span>When should they start?</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="start" value="This week"><span>This week</span></label>
        <label class="chip"><input type="radio" name="start" value="Next week" checked><span>Next week</span></label>
        <label class="chip"><input type="radio" name="start" value="Later"><span>Later</span></label>
      </div>
    </fieldset>

    <div class="step-card">
      <label class="legend" for="area"><span class="step-num">4</span>Where do you live?</label>
      <div class="field" style="margin-top:0">
        <input class="input search-input" id="area" name="area" type="text" placeholder="Start typing, e.g. Kilimani or Nyali" required>
      </div>
      <button class="link-btn" type="button" id="locate" style="margin-top:6px; padding-left:0"><span id="pin-ic"></span>&nbsp;Use my location instead</button>
      <span class="hint" id="loc-msg" role="status">Helpers who live closest come first, so no long-distance fare.</span>
    </div>

    <div class="step-card full">
      <label class="legend" for="phone"><span class="step-num">5</span>Your WhatsApp number</label>
      <input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" required>
      <span class="hint" style="display:block; margin-top:6px">We send your matches here. No sign-up, no password.</span>
      <details class="note-toggle">
        <summary class="link-btn">+ Add a note (optional)</summary>
        <label class="sr-only" for="notes">Anything else?</label>
        <textarea class="input" id="notes" name="notes" maxlength="500" placeholder="For example: two children aged 2 and 5, we speak Kiswahili at home"></textarea>
      </details>
    </div>

    <p class="error-text" id="error" role="alert" hidden></p>

    <div class="sticky-cta">
      <button class="btn" type="submit" id="submit">Show me my matches</button>
      <p class="small center" style="margin:8px 0 0">Free to look. Every helper is verified in person.</p>
    </div>
  </form>
</main>
<script type="module">
  import { api, getConfig, rememberRequest, icons, param, getLocation, nearestAreaName, placePicker, $ } from '/app.js';
  $('#back').innerHTML = icons.back;
  $('#pin-ic').innerHTML = icons.pin;

  const kind = param('kind');
  if (kind) {
    const radio = document.querySelector(`input[name="kind"][value="${CSS.escape(kind)}"]`);
    if (radio) radio.checked = true;
  }

  const cfg = await getConfig();
  const POPULAR = ['Kilimani', 'Kileleshwa', 'Lavington', 'Westlands', 'South B', 'Syokimau', 'Ruaka', 'Rongai'];
  const area = placePicker($('#area'), cfg.areaPoints, { popular: POPULAR });
  try {
    const last = localStorage.getItem('mtaacare.area'); if (last) area.set(last);
    const ph = localStorage.getItem('mtaacare.phone'); if (ph) $('#phone').value = ph;
  } catch {}

  let point = null;
  $('#locate').addEventListener('click', async () => {
    $('#loc-msg').textContent = 'Getting your location…';
    try {
      point = await getLocation();
      area.set(nearestAreaName(point, cfg.areaPoints));
      $('#loc-msg').textContent = `Location added, near ${area.value}. We only use it to find helpers close to you.`;
    } catch (e) { $('#loc-msg').textContent = e.message; }
  });

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, err = $('#error'), btn = $('#submit');
    err.hidden = true;
    if (!area.value) { err.textContent = 'Choose where you live from the list. Start typing your estate or town.'; err.hidden = false; $('#area').focus(); return; }
    const body = {
      kind: f.kind.value,
      tasks: [...f.querySelectorAll('input[name="tasks"]:checked')].map(i => i.value),
      start: f.start.value,
      area: area.value,
      phone: f.phone.value,
      notes: f.notes.value,
      ...(point ? { lat: point.lat, lng: point.lng } : {})
    };
    btn.disabled = true; btn.textContent = 'Finding helpers near you…';
    try {
      const { id } = await api('/api/requests', { method: 'POST', body });
      rememberRequest(id);
      try { localStorage.setItem('mtaacare.area', area.value); localStorage.setItem('mtaacare.phone', f.phone.value); } catch {}
      location.href = `/m/${encodeURIComponent(id)}`;
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false;
      btn.disabled = false; btn.textContent = 'Show me my matches';
    }
  });
</script>
</body>
</html>
