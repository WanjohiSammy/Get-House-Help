<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B34A6">
<title>What do you need? — MtaaCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<script>
  // Opened by double-clicking the file? These pages need the local server.
  if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML = '<main style="font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 20px;line-height:1.5;color:#24173A">' +
      '<h1 style="font-size:24px">Start the MtaaCare server first</h1>' +
      '<p>You opened this page as a file. It needs the app running. In a terminal, inside the <b>mtaacare-app</b> folder, run:</p>' +
      '<pre style="background:#F7EFF3;padding:12px 14px;border-radius:10px;font-size:15px">node tests/local-server.mjs</pre>' +
      '<p>Then open <b>http://localhost:8788</b> in your browser.</p></main>';
  });
</script>
<main class="page">
  <div class="topbar">
    <a class="icon-btn" href="/" aria-label="Back" id="back"></a>
    <h1>What do you need?</h1>
  </div>

  <form id="form" novalidate>
    <fieldset class="section" style="border:0; padding:0; margin-left:0; margin-right:0">
      <legend class="label">Type of help</legend>
      <div class="segmented">
        <label class="chip"><input type="radio" name="kind" value="live-in" checked><span>Live-in</span></label>
        <label class="chip"><input type="radio" name="kind" value="live-out"><span>Live-out</span></label>
        <label class="chip"><input type="radio" name="kind" value="day"><span>Day help</span></label>
      </div>
    </fieldset>

    <fieldset class="section" style="border:0; padding:0; margin-left:0; margin-right:0">
      <legend class="label">Help with</legend>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="tasks" value="cleaning" checked><span>Cleaning</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="cooking" checked><span>Cooking</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="laundry"><span>Laundry</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="children"><span>Children</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="baby"><span>Baby</span></label>
        <label class="chip"><input type="checkbox" name="tasks" value="elderly"><span>Elderly care</span></label>
      </div>
    </fieldset>

    <fieldset class="section" style="border:0; padding:0; margin-left:0; margin-right:0">
      <legend class="label">Start</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="start" value="This week"><span>This week</span></label>
        <label class="chip"><input type="radio" name="start" value="Next week" checked><span>Next week</span></label>
        <label class="chip"><input type="radio" name="start" value="Later"><span>Later</span></label>
      </div>
    </fieldset>

    <div class="field section">
      <label class="label" for="area" style="margin:0">Where do you live?</label>
      <select class="input" id="area" name="area" required><option value="">Choose your area</option></select>
      <span class="hint">Helps who live closest are shown first, so no long-distance fare.</span>
      <button class="link-btn" type="button" id="locate" style="align-self:flex-start"><span id="pin-ic"></span>&nbsp;Use my location instead (more accurate)</button>
      <span class="hint" id="loc-msg" role="status"></span>
    </div>

    <div class="field">
      <label class="label" for="phone" style="margin:0">Your WhatsApp number</label>
      <input class="input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" required>
      <span class="hint">We send your matches here. No sign-up, no password.</span>
    </div>

    <div class="field">
      <label class="label" for="notes" style="margin:0">Anything else? <span class="small">(optional)</span></label>
      <textarea class="input" id="notes" name="notes" maxlength="500" placeholder="For example: two children aged 2 and 5, we speak Kiswahili at home"></textarea>
    </div>

    <p class="error-text" id="error" role="alert" hidden></p>

    <div class="sticky-cta">
      <button class="btn" type="submit" id="submit">Show me my matches</button>
      <p class="small center" style="margin:8px 0 0">Free to look. No sign-up. Every helper is verified in person.</p>
    </div>
  </form>
</main>
<script type="module">
  import { api, getConfig, rememberRequest, icons, param, getLocation, nearestAreaName, $ } from '/app.js';
  $('#back').innerHTML = icons.back;
  $('#pin-ic').innerHTML = icons.pin;
  let point = null;
  $('#locate').addEventListener('click', async () => {
    $('#loc-msg').textContent = 'Getting your location…';
    try {
      point = await getLocation();
      const c = await getConfig();
      select.value = nearestAreaName(point, c.areaPoints);
      $('#loc-msg').textContent = `Location added (near ${select.value}). We only use it to find helps close to you.`;
    } catch (e) { $('#loc-msg').textContent = e.message; }
  });

  const kind = param('kind');
  if (kind) {
    const radio = document.querySelector(`input[name="kind"][value="${CSS.escape(kind)}"]`);
    if (radio) radio.checked = true;
  }

  const select = $('#area');
  getConfig().then(c => {
    for (const a of c.areas) select.add(new Option(a, a));
    try { const last = localStorage.getItem('mtaacare.area'); if (last) select.value = last; } catch {}
    try { const ph = localStorage.getItem('mtaacare.phone'); if (ph) $('#phone').value = ph; } catch {}
  });

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, err = $('#error'), btn = $('#submit');
    err.hidden = true;
    if (!select.value) { err.textContent = 'Please choose your area.'; err.hidden = false; select.focus(); return; }
    const body = {
      kind: f.kind.value,
      tasks: [...f.querySelectorAll('input[name="tasks"]:checked')].map(i => i.value),
      start: f.start.value,
      area: select.value,
      phone: f.phone.value,
      notes: f.notes.value,
      ...(point ? { lat: point.lat, lng: point.lng } : {})
    };
    btn.disabled = true; btn.textContent = 'Finding helps near you…';
    try {
      const { id } = await api('/api/requests', { method: 'POST', body });
      rememberRequest(id);
      try { localStorage.setItem('mtaacare.area', select.value); localStorage.setItem('mtaacare.phone', f.phone.value); } catch {}
      location.href = `/m/${encodeURIComponent(id)}`;
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false;
      btn.disabled = false; btn.textContent = 'Show me my matches';
    }
  });
</script>
</body>
</html>
